<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC Card Order Tracker - Mobile Friendly</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 15px;
  }

  h2 {
    text-align: center;
    margin-bottom: 15px;
  }

  form {
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }

  input, select, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px;
    box-sizing: border-box;
  }

  button {
    background: #4CAF50;
    color: white;
    font-weight: bold;
    border: none;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #43a047;
  }

  .order-card {
    background: #fff;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
  }

  .row > div {
    flex: 1;
    min-width: 100px;
  }

  .customer-name {
    font-weight: bold;
    font-size: 18px;
  }

  .detail {
    font-size: 14px;
    color: #555;
    margin-top: 5px;
  }

  .update-btn {
    background: #2196F3;
  }

  .delete-btn {
    background: #e53935;
  }

  @media(max-width:500px){
    .row {
      flex-direction: column;
      align-items: stretch;
    }
    .row > div {
      width: 100%;
    }
  }
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBcMBLjda3ZbYxo-rsyzIBXoM2JilNtMaU",
    authDomain: "digic-organization.firebaseapp.com",
    projectId: "digic-organization",
    storageBucket: "digic-organization.firebasestorage.app",
    messagingSenderId: "142724095113",
    appId: "1:142724095113:web:8104e52bbed7598d3ffa58"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>

<body>

<h2>📦 NFC Card Order Tracker</h2>

<form id="orderForm">
  <input type="text" id="userName" placeholder="Enter Customer Name" required>
  <button type="submit">Add Order</button>
</form>

<div id="ordersContainer"></div>

<script>
const form = document.getElementById('orderForm');
const container = document.getElementById('ordersContainer');
const ordersRef = db.collection('nfc_orders');

const stepsList = ['Payment Done', 'Login Added', 'Details Updated', 'Delivery Completed'];

// Add new order
form.addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('userName').value.trim();
  if (!name) return;
  await ordersRef.add({
    name,
    currentStep: -1, // -1 = nothing done yet
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
  form.reset();
});

// Update step
async function updateStep(id, selectElem) {
  const stepIndex = parseInt(selectElem.value);
  await ordersRef.doc(id).update({ currentStep: stepIndex });
}

// Delete order
async function deleteOrder(id) {
  if(confirm('Delete this order?')) {
    await ordersRef.doc(id).delete();
  }
}

// Render orders in realtime
ordersRef.orderBy('timestamp','desc').onSnapshot(snapshot => {
  container.innerHTML = '';
  snapshot.forEach(doc => {
    const order = doc.data();
    const card = document.createElement('div');
    card.className = 'order-card';

    // Row: Name | Dropdown | Update/Delete
    const row = document.createElement('div');
    row.className = 'row';

    // Determine dropdown value and pending text
    let dropdownHTML = '<option value="-1">Select stage</option>';
    stepsList.forEach((s, i) => {
      dropdownHTML += `<option value="${i}" ${i===order.currentStep ? 'selected':''}>${s}</option>`;
    });

    row.innerHTML = `
      <div class="customer-name" style="color:${order.currentStep===3?'#4CAF50':'#e53935'}">${order.name}</div>
      <div>
        <select>${dropdownHTML}</select>
      </div>
      <div style="display:flex; gap:5px;">
        <button class="update-btn">Update</button>
        <button class="delete-btn">Delete</button>
      </div>
    `;

    // Row: Pending detail
    const detail = document.createElement('div');
    detail.className = 'detail';
    const nextStepIndex = order.currentStep+1;
    detail.textContent = nextStepIndex < stepsList.length ? `Pending: ${stepsList[nextStepIndex]}` : 'All steps completed ✅';

    // Event listeners
    row.querySelector('.update-btn').addEventListener('click', () => {
      const select = row.querySelector('select');
      updateStep(doc.id, select);
    });
    row.querySelector('.delete-btn').addEventListener('click', () => deleteOrder(doc.id));

    card.appendChild(row);
    card.appendChild(detail);
    container.appendChild(card);
  });
});
</script>

</body>
</html>
